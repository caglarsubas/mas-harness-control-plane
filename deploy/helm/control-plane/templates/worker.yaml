{{- if .Values.worker.enabled }}
{{- $name := include "planeon-control.name" (dict "Release" .Release "component" "profile-compiler-worker") }}
{{- $secret := required "worker.existingConfigSecret is required" .Values.worker.existingConfigSecret }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ required "worker.replicas is required" .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: planeon-control-plane
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: profile-compiler-worker
          image: {{ include "planeon-control.image" (dict "component" "worker" "values" .Values.worker) | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--run-once", "--contracts-state", "NOT_READY", "--store-state", "NOT_READY"]
          envFrom:
            - secretRef:
                name: {{ $secret }}
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      restartPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-deny-all
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
